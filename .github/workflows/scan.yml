name: Daily stock scan

# NSE 15:30 IST (10:00 UTC) pe band hota hai.
#
# DO baar chalate hain, ek nahi. Wajah: GitHub free-tier pe scheduled jobs
# bahut late chalte hain - humne dekha 5 se 9 ghante tak:
#     schedule 11:30 UTC  ->  asli run 17:03, 18:29, 20:49 UTC
# Yaani 5 PM IST ka scan aadhi raat ko chal raha tha, aur shaam ko dekho toh
# kal ka data dikhta tha. Do slots rakhne se kam se kam ek time pe lag jaata hai.
#
#   10:45 UTC = 16:15 IST  (close ke 45 min baad)
#   14:15 UTC = 19:45 IST  (shaam wala, pehla late hua toh yeh bachata hai)
#
# Jaldi chahiye toh Actions tab se "Run workflow" - 90 second me ho jaata hai.
on:
  schedule:
    - cron: "45 10 * * 1-5"
    - cron: "15 14 * * 1-5"
  workflow_dispatch:          # phone se bhi manually chala sakte ho

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install deps
        run: pip install -r requirements.txt

      - name: Run scan
        run: python scan_phone.py

      - name: Check page was built
        run: |
          test -s index.html || { echo "index.html missing or empty"; exit 1; }
          ls -la index.html

      - name: Stage site
        run: |
          mkdir -p _site
          cp index.html _site/
          cp scan_rule1.csv scan_rule2.csv _site/ 2>/dev/null || true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: scan
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
